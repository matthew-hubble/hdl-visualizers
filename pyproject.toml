[project]
name = "fixed-point"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matt Lowell", email = "matthew@hubble.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "playwright>=1.40",
    "systemrdl-compiler>=1.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
# The suites write generated dataclasses here. Ruff skips them because they are not tracked;
# mypy has no such rule, and without this it checks a different set of files once the tests
# have been run than it does on a fresh checkout.
exclude = "^tests/js/out/"

[project.scripts]
fixed-point = "fixed_point:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
