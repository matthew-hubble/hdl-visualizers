name: CD

# Publishes the site to GitHub Pages. It runs only after CI has finished on main, and only when
# CI passed, so nothing reaches the live site that was not linted and tested first.
#
# Two things about workflow_run are worth knowing before editing this. It only fires for a copy
# of this file that is on the default branch, so the split takes effect once cd.yml is on main.
# And the run is handed the workflow and the token of the default branch rather than of the
# commit that was tested, so the checkout below names that commit rather than trusting the tip
# of main, which a second merge may already have moved on.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Publish to GitHub Pages
    # `branches` above keeps this to CI runs on main. `event` holds it to a merge or a push, so
    # a pull request opened from main cannot publish; re-running that CI run from the Actions
    # tab keeps the push event, and so is the way to deploy again without a new commit.
    # `conclusion` is what stops a red run here.
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # A job that sets permissions gets only what it lists, so the checkout needs contents here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out the commit CI passed on
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The site is every page, stylesheet and script at the root. Nothing is built, so this is a
      # copy; the tests, the lock files and the tooling stay behind. test_site.py checks that this
      # picks up everything the pages ask for.
      - name: Collect the site
        run: |
          mkdir _site
          cp -- *.html *.css *.js _site/
          ls -l _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
