name: CI

# Every push and pull request is linted and tested. Publishing lives in cd.yml, which waits on
# this workflow and only runs when it passed on main, so the live site is built from a green
# commit and nothing here needs to know about deployment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch supersedes its own earlier runs. main does not: a cancelled run on main never reaches
# a conclusion, and CD waits on that conclusion, so the commit would silently go unpublished.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # setup-uv stops publishing bare major tags after v7, so this is pinned to an exact
      # release. Dependabot raises the bump; a `@v10` would simply not resolve.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install the dev group
        run: uv sync --group dev

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src tests

  test:
    name: Test suites
    runs-on: ubuntu-latest
    # The browser suites are the only thing here that could hang rather than fail.
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # gcc ships with the runner, Verilator does not. A suite skips what a missing tool would
      # have checked rather than failing, so the version is printed to prove it arrived.
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes verilator
          verilator --version

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install the Node packages
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Also creates the .venv the JavaScript harness reaches for to run systemrdl-compiler.
      - name: Install the dev group
        run: uv sync --group dev

      # Both suites drive a browser. The two Playwright packages share one browser cache, so
      # whichever runs second is a no-op while their versions agree, and a real download when
      # they drift apart.
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          uv run playwright install --with-deps chromium

      - name: JavaScript suites
        run: npm run test:js

      - name: Python suites
        if: ${{ !cancelled() }}
        run: npm run test:py

      - name: Keep what the browser suites drew
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: tests/js/out/
          if-no-files-found: ignore
          retention-days: 7
