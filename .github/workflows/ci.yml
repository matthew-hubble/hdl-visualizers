name: CI

# Every push and pull request is linted and tested. A push to main that passes both is
# published to GitHub Pages, so the live site is only ever built from a green commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch supersedes its own earlier runs; main does not, so a queued deploy is never
# cancelled by the push behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: Format, lint and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install the dev group
        run: uv sync --group dev

      - name: Formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src tests

  test:
    name: Test suites
    runs-on: ubuntu-latest
    # The browser suites are the only thing here that could hang rather than fail.
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # gcc ships with the runner, Verilator does not. A suite skips what a missing tool would
      # have checked rather than failing, so the version is printed to prove it arrived.
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes verilator
          verilator --version

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install the Node packages
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      # Also creates the .venv the JavaScript harness reaches for to run systemrdl-compiler.
      - name: Install the dev group
        run: uv sync --group dev

      # Both suites drive a browser. The two Playwright packages share one browser cache, so
      # whichever runs second is a no-op while their versions agree, and a real download when
      # they drift apart.
      - name: Install Chromium
        run: |
          npx playwright install --with-deps chromium
          uv run playwright install --with-deps chromium

      - name: JavaScript suites
        run: npm run test:js

      - name: Python suites
        if: ${{ !cancelled() }}
        run: npm run test:py

      - name: Keep what the browser suites drew
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-output
          path: tests/js/out/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Publish to GitHub Pages
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A job that sets permissions gets only what it lists, so the checkout needs contents here.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time, and never cancel one that has started.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # The site is every page, stylesheet and script at the root. Nothing is built, so this is a
      # copy; the tests, the lock files and the tooling stay behind. test_site.py checks that this
      # picks up everything the pages ask for.
      - name: Collect the site
        run: |
          mkdir _site
          cp -- *.html *.css *.js _site/
          ls -l _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
